name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        shell: pwsh
        run: |
          $sitePath = Join-Path $PWD '_site'
          New-Item -ItemType Directory -Path $sitePath -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD 'web' '*') -Destination $sitePath -Recurse -Force

          ./Build-RehearsalSnapshot.ps1 `
            -OutputPath (Join-Path $sitePath 'rehearsals.json')

          New-Item -ItemType File -Path (Join-Path $sitePath '.nojekyll') -Force | Out-Null

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
