name: Deploy GitHub Pages
run-name: ${{ github.event_name == 'schedule' && 'Scheduled rehearsal snapshot' || github.event_name == 'push' && 'Rehearsal snapshot after push to main' || inputs.triggerSource == 'widt-update-button' && 'Rehearsal snapshot requested using WIDT update button' || inputs.triggerSource == 'github-run-button' && 'Rehearsal snapshot requested using GitHub Run workflow button' || 'Rehearsal snapshot deployment' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      triggerSource:
        description: Source requesting this deployment
        required: false
        default: github-run-button
        type: choice
        options:
          - github-run-button
          - widt-update-button
  schedule:
    - cron: '19 3 * * *'
      timezone: America/Los_Angeles

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record deployment trigger
        shell: pwsh
        env:
          TRIGGER_SOURCE: ${{ inputs.triggerSource }}
        run: |
          $trigger = switch ($env:GITHUB_EVENT_NAME) {
            'schedule' {
              'Scheduled refresh'
            }
            'push' {
              'Push to main'
            }
            'workflow_dispatch' {
              switch ($env:TRIGGER_SOURCE) {
                'github-run-button' {
                  'GitHub Run workflow button'
                }
                'widt-update-button' {
                  'WIDT update button'
                }
                default {
                  throw "Unsupported workflow dispatch source: '$env:TRIGGER_SOURCE'."
                }
              }
            }
            default {
              throw "Unsupported workflow event: '$env:GITHUB_EVENT_NAME'."
            }
          }

          @(
            '### Deployment request'
            ''
            '| Field | Value |'
            '| --- | --- |'
            "| Trigger | $trigger |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        shell: pwsh
        run: |
          $sitePath = Join-Path $PWD '_site'
          New-Item -ItemType Directory -Path $sitePath -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD 'web' '*') -Destination $sitePath -Recurse -Force

          ./Build-RehearsalSnapshot.ps1 `
            -OutputPath (Join-Path $sitePath 'rehearsals.json')

          New-Item -ItemType File -Path (Join-Path $sitePath '.nojekyll') -Force | Out-Null

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
