<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'">
  <title>WIDT Rehearsal Results</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="results.js"></script>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <div>
        <p class="eyebrow">Whidbey Island Dance Theatre</p>
        <h1>Rehearsal Results</h1>
      </div>
      <nav class="header-links" aria-label="Page links">
        <a id="edit-query-link" href="index.html">Edit query</a>
        <a href="https://www.widtonline.org/backstage">WIDT Backstage</a>
      </nav>
    </header>

    <section id="status-panel" class="panel" aria-live="polite">
      <p id="status" class="message">Loading rehearsals...</p>
    </section>

    <section id="summary-panel" class="panel" hidden>
      <h2 id="result-summary"></h2>
      <p id="date-range"></p>
      <p class="field-help">Added calendar events are independent copies and will not receive later schedule updates.</p>
      <p id="show-all-note" class="field-help" hidden></p>
      <details id="query-rules">
        <summary id="query-rules-summary">Query rules</summary>
        <ul id="active-rules" class="rule-list"></ul>
      </details>
    </section>

    <div id="results" class="results" hidden></div>

    <dialog id="event-dialog" class="event-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Rehearsal details</p>
          <h2 id="dialog-title"></h2>
        </div>
        <button id="close-dialog" type="button" class="secondary-button">Close</button>
      </div>

      <p id="dialog-when" class="event-time"></p>
      <p id="dialog-location" class="event-location"></p>

      <div class="tab-list" role="tablist" aria-label="Event detail views">
        <button
          id="description-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="description-panel"
          aria-label="Original calendar description"
          data-panel="description-panel"
        >Description</button>
        <button
          id="names-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="names-panel"
          aria-label="Parsed group and name entries"
          data-panel="names-panel"
          tabindex="-1"
        >Parsed names</button>
        <button
          id="full-text-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="full-text-panel"
          aria-label="Normalized full text"
          data-panel="full-text-panel"
          tabindex="-1"
        >Full text</button>
      </div>

      <section
        id="description-panel"
        class="tab-panel detail-text"
        role="tabpanel"
        aria-labelledby="description-tab"
        tabindex="0"
      ></section>
      <section
        id="names-panel"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="names-tab"
        tabindex="0"
        hidden
      ></section>
      <section
        id="full-text-panel"
        class="tab-panel detail-text normalized-text"
        role="tabpanel"
        aria-labelledby="full-text-tab"
        tabindex="0"
        hidden
      ></section>
    </dialog>
  </main>
</body>
</html>
